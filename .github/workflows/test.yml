name: Test tooling

on:
  pull_request:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test.yml"
      - "config/**"
      - "scripts/**"
      - "tests/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Run tests
        run: uv run --with pytest --with "pillow>=11.0" pytest
